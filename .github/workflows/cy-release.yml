name: Release Cy

on:
  push:
    tags:
      - "cy-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test Cy
        run: go test ./cy/...

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#cy-}"
          mkdir -p dist

          for target in \
            linux/amd64 \
            linux/arm64 \
            darwin/amd64 \
            darwin/arm64 \
            windows/amd64
          do
            os="${target%/*}"
            arch="${target#*/}"
            output="dist/cy-${os}-${arch}"
            if [[ "$os" == "windows" ]]; then
              output="${output}.exe"
            fi

            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${version}" \
              -o "$output" \
              ./cy
          done

          (
            cd dist
            sha256sum cy-* > checksums.txt
          )

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cy ${GITHUB_REF_NAME#cy-}" \
            --generate-notes \
            --verify-tag
